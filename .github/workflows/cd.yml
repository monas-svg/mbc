name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-mbcode-prod
  AKS_CLUSTER_NAME: aks-mbcode-prod
  ACR_NAME: mbcodeprodacr
  IMAGE_NAME: mbcode

jobs:
  deploy-infra:
    name: Provision Azure infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.AZURE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=mbcode/aks.tfstate"

      - name: Terraform plan
        working-directory: infra/terraform
        env:
          TF_VAR_environment: prod
          TF_VAR_location: westeurope
          TF_VAR_project_name: mbcode
          TF_VAR_aks_node_count: 2
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_environment: prod
          TF_VAR_location: westeurope
          TF_VAR_project_name: mbcode
          TF_VAR_aks_node_count: 2
        run: terraform apply -auto-approve tfplan

  deploy-app:
    name: Build image and deploy to AKS
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure ACR + AKS access
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Build and push container image
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_REF=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker build -t "$IMAGE_REF" .
          docker push "$IMAGE_REF"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic mbcode-app-secrets \
            --namespace mbcode \
            --from-literal=DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/networkpolicy.yaml
          kubectl rollout status deployment/mbcode-web -n mbcode --timeout=180s
