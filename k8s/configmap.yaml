apiVersion: v1
kind: ConfigMap
metadata:
  name: mbcode-config
  namespace: mbcode
data:
  DJANGO_SETTINGS_MODULE: "config.settings"
  DJANGO_LOG_LEVEL: "INFO"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,mbcode.example.com"
  CSRF_TRUSTED_ORIGINS: "https://mbcode.example.com"
  SECURE_SSL_REDIRECT: "True"
  TIME_ZONE: "Africa/Douala"
  CORS_ALLOWED_ORIGINS: "https://mbcode.example.com"
