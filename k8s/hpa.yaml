apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mbcode-web-hpa
  namespace: mbcode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mbcode-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
