apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mbcode-ingress
  namespace: mbcode
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - mbcode.example.com
      secretName: mbcode-tls
  rules:
    - host: mbcode.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mbcode-web
                port:
                  number: 80
